<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" href="/favicon-v3.ico" sizes="16x16 32x32 48x48" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon-light-v3.svg"
      sizes="any"
      data-theme-favicon
      data-light-favicon="favicon-light-v3.svg"
      data-dark-favicon="favicon-dark-v3.svg"
    />
    <link rel="apple-touch-icon" href="/apple-touch-icon-v3.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#e9eaec" />

    <title>Umer Farooq — HPC & AI infrastructure engineer, and solution architect</title>
    <meta
      name="description"
      content="Umer Farooq builds the infrastructure underneath HPC and AI workloads — bare-metal Kubernetes and HPC platforms, GPU-accelerated systems, and the reference architectures behind enterprise GPU cloud bids."
    />
    <meta name="author" content="Umer Farooq" />

    <meta property="og:title" content="Umer Farooq — HPC & AI infrastructure engineer, and solution architect" />
    <meta
      property="og:description"
      content="Umer Farooq builds the infrastructure underneath HPC and AI workloads — bare-metal Kubernetes and HPC platforms, GPU-accelerated systems, and the reference architectures behind enterprise GPU cloud bids."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://umer-farooq-cs.github.io/portfolio/" />
    <meta property="og:image" content="https://umer-farooq-cs.github.io/portfolio/og-portfolio.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Umer Farooq — HPC & AI infrastructure engineer, and solution architect" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Umer Farooq — HPC & AI infrastructure engineer, and solution architect" />
    <meta
      name="twitter:description"
      content="Umer Farooq builds the infrastructure underneath HPC and AI workloads — bare-metal Kubernetes and HPC platforms, GPU-accelerated systems, and the reference architectures behind enterprise GPU cloud bids."
    />
    <meta name="twitter:image" content="https://umer-farooq-cs.github.io/portfolio/og-portfolio.png" />

    <script>
      // Applies the stored theme before first paint so there is no flash of the
      // wrong theme on load. Mirrors the logic in src/lib/theme.tsx.
      (function () {
        try {
          var stored = localStorage.getItem("uf-theme");
          // Dark when it was chosen, or when the visitor opted into (or defaults
          // to, absent a stored choice) following the OS. Must match
          // readStoredChoice()/resolve() in src/lib/theme.tsx exactly, or the
          // first paint disagrees with the app and the theme flashes.
          var dark =
            stored === "dark" ||
            ((stored === "system" || !stored) &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          root.classList.toggle("dark", dark);
          root.dataset.theme = dark ? "dark" : "light";
          root.style.colorScheme = dark ? "dark" : "light";
          var themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor) themeColor.setAttribute("content", dark ? "#08090b" : "#e9eaec");
          var favicon = document.querySelector("link[data-theme-favicon]");
          var faviconFile = favicon &&
            (dark ? favicon.dataset.darkFavicon : favicon.dataset.lightFavicon);
          var faviconHref = favicon && favicon.getAttribute("href");
          if (faviconFile && faviconHref) {
            favicon.setAttribute("href", faviconHref.replace(/[^/]+$/, faviconFile));
          }
        } catch (e) {
          /* storage blocked — the app applies the theme on mount */
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
