    <script>
      // Applies the stored theme before first paint so there is no flash of the
      // wrong theme on load. Mirrors the logic in src/lib/theme.tsx.
      (function () {
        try {
          var stored = localStorage.getItem("uf-theme");
          // Dark only when it was chosen, or when the visitor opted into following
          // the OS. Must match readStoredChoice() in src/lib/theme.tsx exactly, or
          // the first paint disagrees with the app and the theme flashes.
          var dark =
            stored === "dark" ||
            (stored === "system" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          root.classList.toggle("dark", dark);
          root.dataset.theme = dark ? "dark" : "light";
          root.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          /* storage blocked — the app applies the theme on mount */
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
