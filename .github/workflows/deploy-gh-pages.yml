# Deploy to GitHub Pages (works with both user and project sites).
# Nothing deploys unless lint, typecheck, and tests all pass.
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # Daily refresh of the GitHub / arXiv snapshot: 03:20 UTC = 08:20 PKT.
    # Off the hour because scheduled runs queue heavily at :00.
    - cron: "20 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

  build:
    name: Build
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Refresh live data snapshot
        # Writes src/data/generated/*.json before the bundle embeds it. Exits 0 even
        # when a source is down — it keeps the committed snapshot and warns.
        run: node scripts/fetch-data.mjs
        env:
          # Raises the GitHub API limit from 60 to 5000 requests/hour.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build for GitHub Pages
        env:
          VITE_FORMSPREE_FORM_ID: ${{ secrets.VITE_FORMSPREE_FORM_ID }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          # Project site: /<repo>/ (default). User site or custom domain: set to /
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
        run: npm run build:gh-pages

      # build:gh-pages already runs check-build.mjs, but assert it explicitly so a
      # future change to that script chain cannot silently drop the gate.
      - name: Check the build is deployable
        run: npm run check:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  lighthouse:
    name: Lighthouse budget
    needs: verify
    runs-on: ubuntu-latest
    # Advisory while the redesign is in flight; becomes a blocking gate in Phase 5
    # once the new design is in place. See REDESIGN_PLAN.md §12.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        # LHCI serves dist/ at localhost root. A /portfolio/ build points its
        # scripts at a path that does not exist on that audit server, producing
        # a blank page and NO_FCP instead of a real performance measurement.
        env:
          VITE_BASE_PATH: /
        run: npm run build

      - name: Run Lighthouse CI
        run: npx --yes @lhci/cli@0.14.x autorun

  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
